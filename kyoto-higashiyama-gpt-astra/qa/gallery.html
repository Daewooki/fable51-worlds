<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kyoto · Viewpoint review</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23a66b64'/%3E%3C/svg%3E">
<style>*{box-sizing:border-box}body{margin:0;background:#f1eee6;color:#3e483e;font:14px system-ui,sans-serif}header{padding:40px 5vw 26px;border-bottom:1px solid #d6d4c9;display:flex;justify-content:space-between;gap:24px;align-items:end}h1{font:42px Georgia,serif;margin:12px 0}small{letter-spacing:.16em;text-transform:uppercase}a{color:inherit}#summary{color:#777d6f;line-height:1.7}main{padding:30px 5vw;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:25px}article{background:#faf8f1;border:1px solid #d8d8cd}article img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}article div{padding:18px}h2{font:22px Georgia,serif;margin:0 0 10px}p{font-size:12px;color:#838576;margin:5px 0}button{background:transparent;color:inherit;border:1px solid #bbbfb0;padding:10px 16px;cursor:pointer}dialog{border:0;padding:0;background:#171c18;color:#eee;max-width:96vw}dialog img{display:block;max-width:94vw;max-height:85vh}dialog footer{padding:16px;display:flex;justify-content:space-between;align-items:center}dialog::backdrop{background:#111c} @media(max-width:650px){header{align-items:start;flex-direction:column}main{grid-template-columns:1fr}h1{font-size:34px}}</style>
<header><div><small>Kyoto, unhurried / visual QA</small><h1>A walk, in 34 views.</h1><div id="summary">Loading the capture manifest…</div></div><a href="/">Return to the world ↗</a></header><main></main><dialog><img alt=""><footer><span></span><button>Close ×</button></footer></dialog>
<script type="module">
const manifest=await fetch('./final/manifest.json').then(r=>r.json()),main=document.querySelector('main'),dialog=document.querySelector('dialog');
document.querySelector('#summary').textContent=`${manifest.heroCount} original 1600 × 900 frames · Captured ${new Date(manifest.capturedAt).toLocaleString()} · ${manifest.errors.length} browser errors. These images are review evidence; scores and remaining discrepancies are in the QA report.`;
for(const [index,shot]of manifest.shots.entries()){
 const article=document.createElement('article'),image=document.createElement('img'),body=document.createElement('div'),heading=document.createElement('h2'),details=document.createElement('p'),link=document.createElement('a');
 image.src=`./final/${shot.file}`;image.loading='lazy';image.alt=shot.camera.name;heading.textContent=`${String(index+1).padStart(2,'0')} · ${shot.camera.name}`;
 details.textContent=`Camera ${shot.camera.pos.map(n=>n.toFixed(2)).join(', ')} · FOV ${shot.camera.fov}°`;
 link.href=image.src;link.textContent='Open original PNG ↗';link.target='_blank';image.onclick=()=>{dialog.querySelector('img').src=image.src;dialog.querySelector('img').alt=image.alt;dialog.querySelector('span').textContent=heading.textContent;dialog.showModal();};
 body.append(heading,details,link);article.append(image,body);main.append(article);
}
dialog.querySelector('button').onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog)dialog.close();};
</script></html>
