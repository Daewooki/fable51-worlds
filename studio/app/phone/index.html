<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>MV Studio — Phone camera</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #14161a; color: #e6e8eb;
        font: 16px/1.4 -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
        -webkit-user-select: none; user-select: none;
        touch-action: none;
      }
      #app { display: flex; flex-direction: column; height: 100%; padding: 16px; gap: 16px; }
      h1 { font-size: 16px; margin: 0; color: #8a909c; text-transform: uppercase; letter-spacing: 0.06em; }
      #status { font-size: 14px; color: #8a909c; min-height: 1.4em; }
      #message { font-size: 15px; color: #d9a441; }
      .sliders { display: flex; flex-direction: column; gap: 20px; flex: 1; justify-content: center; }
      .slider-row { display: flex; flex-direction: column; gap: 6px; }
      .slider-row label { font-size: 13px; color: #8a909c; }
      input[type="range"] { width: 100%; height: 44px; }
      .buttons { display: flex; gap: 12px; }
      button {
        flex: 1;
        font-size: 18px;
        padding: 20px 0;
        border-radius: 10px;
        border: 1px solid #2c3038;
        background: #21242b;
        color: #e6e8eb;
        cursor: pointer;
      }
      button:active { border-color: #5b9dff; }
      #rec.recording { background: #e5584f; color: #14161a; }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>MV Studio · Phone camera</h1>
      <div id="message"></div>
      <div id="status">not connected</div>
      <div class="sliders">
        <div class="slider-row">
          <label for="dolly">Dolly (back / forward)</label>
          <input id="dolly" type="range" min="-1" max="1" step="0.05" value="0" />
        </div>
        <div class="slider-row">
          <label for="zoom">Zoom (fov)</label>
          <input id="zoom" type="range" min="30" max="90" value="66" />
        </div>
      </div>
      <div class="buttons">
        <button id="start" type="button">Start</button>
        <button id="rec" type="button">Record</button>
      </div>
    </div>
    <script type="module" src="./phone.ts"></script>
  </body>
</html>
